# Jev questions. Outcome labels and types are fixed by code (dp_agents/questions.py).
# N9 may change the `instructions` and `criteria` descriptions only.
version: 1
forks:
  specified:
    type: noul
    instructions: >-
      Is this GitHub issue specified well enough that an engineer could build it without asking a question?
      It needs a clear goal and checkable acceptance criteria.
    criteria:
      "true": The goal and every acceptance criterion are concrete and testable.
      "false": The goal is vague, or an acceptance criterion cannot be checked.
  target_file:
    type: choice
    instructions: >-
      Which one of these repository files must change first to deliver this plan step?
  retry:
    type: noul
    instructions: >-
      A build attempt failed with the output shown. Will one more attempt with this failure as feedback
      most likely fix it?
    criteria:
      "true": The failure is specific and local (a test assertion, a type error, a lint rule) and the fix is clear.
      "false": The failure repeats, is environmental, or shows the plan itself is wrong.
  done:
    type: noul
    instructions: >-
      Does this diff fully deliver the acceptance criterion shown, including a test that proves it?
    criteria:
      "true": The criterion is implemented and a test in the diff checks it.
      "false": The criterion is missing, partial, or untested.
  risk:
    type: score
    instructions: >-
      How risky is merging this diff for a multi-tenant invoice payment product?
    levels:
      - "0: docs, tests or copy only"
      - "1: local change behind existing checks"
      - "2: changes business logic with tests"
      - "3: touches auth, tenancy, money movement or data migrations"
      - "4: could leak another tenant's data or approve a payment wrongly"
