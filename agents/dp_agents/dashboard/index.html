<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DocuPay agents</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --line: #e3e6eb; --ink: #14171c; --ink-2: #3b4250;
  --muted: #6b7381; --accent: #2f6fde; --accent-soft: #e6eefc; --ok: #1d8a4e; --ok-soft: #e3f4ea;
  --warn: #b26b00; --warn-soft: #fbf0dc; --bad: #c4352b; --bad-soft: #fbe6e4; --opus: #7b4bc4; --opus-soft: #f0e9fb;
  --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1116; --surface: #161a21; --surface-2: #1d222b; --line: #2a303b; --ink: #eef1f5; --ink-2: #c3c9d3;
    --muted: #8a93a3; --accent: #6b9cf0; --accent-soft: #1b2a44; --ok: #4cc488; --ok-soft: #13301f;
    --warn: #e7a23b; --warn-soft: #33270f; --bad: #f07267; --bad-soft: #3a1714; --opus: #b48cf2; --opus-soft: #2a1f3d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill.active { background: var(--ok-soft); color: var(--ok); } .pill.passive { background: var(--accent-soft); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live .dot { background: var(--ok); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 48px; display: grid; gap: 16px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.kpi { padding: 14px 16px; } .kpi p { margin: 0; color: var(--muted); font-size: 12px; }
.kpi b { display: block; font-size: 22px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); }
.grid2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); }
@media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
.card h2 { font-size: 14px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.card h2 span { color: var(--muted); font-weight: 400; font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.nowrap, th { white-space: nowrap; }
td.clip { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tr.new { animation: flash 1.6s ease-out; } @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--muted); }
.badge { display: inline-block; white-space: nowrap; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 650; }
.b-jev { background: var(--accent-soft); color: var(--accent); } .b-opus { background: var(--opus-soft); color: var(--opus); }
.b-fallback { background: var(--warn-soft); color: var(--warn); } .b-ok { background: var(--ok-soft); color: var(--ok); }
.b-bad { background: var(--bad-soft); color: var(--bad); } .b-wait { background: var(--warn-soft); color: var(--warn); }
.b-neutral { background: var(--surface-2); color: var(--muted); }
.bar { position: relative; width: 110px; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--accent); }
.bar.split i { background: var(--opus); }
.prob { display: flex; align-items: center; gap: 8px; } .prob .mono { min-width: 44px; text-align: right; }
.scroll { max-height: 560px; overflow: auto; }
.gate { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.gate:last-child { border-bottom: 0; }
.gate .actions { display: flex; gap: 8px; }
button { font: inherit; font-weight: 600; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
button.approve { background: var(--ok); color: #fff; border-color: transparent; } button.reject { color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.pipeline { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px; }
.node { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; }
.node.on { background: var(--accent); color: #fff; }
.empty { padding: 24px 16px; color: var(--muted); text-align: center; }
.signin { max-width: 380px; margin: 12vh auto; padding: 24px; display: grid; gap: 12px; }
.signin input { font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>DocuPay agents</h1>
  <span id="window" class="pill">window …</span>
  <span id="live" class="pill"><span class="dot"></span><span id="live-text">connecting</span></span>
  <span style="flex:1"></span>
  <span class="muted" id="updated"></span>
</header>
<main id="app">
  <section class="kpis" id="kpis"></section>
  <section class="card"><h2>Graph <span>current node per running ticket</span></h2><div class="pipeline" id="pipeline"></div></section>
  <div class="grid2">
    <section class="card">
      <h2>Forks <span>every decision: probability, route, result</span></h2>
      <div class="scroll"><table>
        <thead><tr><th>Time</th><th>Ticket</th><th>Node · fork</th><th>Probability</th><th>Route</th><th>Decision</th><th>Result</th></tr></thead>
        <tbody id="forks"></tbody>
      </table></div>
    </section>
    <div style="display:grid;gap:16px;align-content:start">
      <section class="card"><h2>Gates <span>wait for you</span></h2><div id="gates"></div></section>
      <section class="card"><h2>Tickets</h2><div id="tickets"></div></section>
      <section class="card"><h2>Self-improvement (N9)</h2><div id="improve"></div></section>
    </div>
  </div>
</main>
<script>
const NODES = ["N1 intake", "N2 plan", "N3 build", "N4 verify", "N5 review", "N6 evaluate", "N7 ship", "G1 PR gate"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const time = (ts) => new Date(ts * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
let state = null, seen = new Set();

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: "same-origin", ...opts, headers: { "X-Requested-With": "dashboard", ...(opts.headers || {}) } });
  if (res.status === 401) { signIn(); throw new Error("signed out"); }
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
}

function signIn() {
  document.body.innerHTML = `<div class="card signin"><h1 style="margin:0;font-size:18px">DocuPay agents</h1>
    <p class="muted" style="margin:0">Enter the dashboard token from the server's env file.</p>
    <form onsubmit="location.href='/login?token='+encodeURIComponent(this.t.value);return false" style="display:grid;gap:12px">
    <input name="t" type="password" autocomplete="current-password" placeholder="DASHBOARD_TOKEN" autofocus>
    <button class="approve">Sign in</button></form></div>`;
}

function probCell(f) {
  const p = f.probs; if (!p) return `<span class="muted">Jev failed</span>`;
  let label, v;
  if (f.fork.startsWith("risk")) {
    v = Object.entries(p).reduce((s, [k, x]) => s + Number(k) * x, 0);
    return `<div class="prob"><span class="bar ${f.route === "jev" ? "" : "split"}"><i style="width:${(v / 4) * 100}%"></i></span><span class="mono">${v.toFixed(2)}/4</span></div>`;
  }
  if ("yes" in p) { v = p.yes; label = "yes"; } else { [label, v] = Object.entries(p).sort((a, b) => b[1] - a[1])[0]; }
  return `<div class="prob"><span class="bar ${f.route === "jev" ? "" : "split"}"><i style="width:${v * 100}%"></i></span><span class="mono">${(v * 100).toFixed(0)}%</span><span class="muted mono">${esc(label.split("/").pop())}</span></div>`;
}

function routeBadge(r) {
  return r === "jev" ? `<span class="badge b-jev">Jev · code</span>` : r === "opus" ? `<span class="badge b-opus">split → Opus</span>` : `<span class="badge b-fallback">Jev error → Opus</span>`;
}

function resultCell(f) {
  if (f.label === null || f.label === undefined) return `<span class="badge b-neutral">pending</span>`;
  if (f.fork.startsWith("risk")) return f.label === "approved" ? `<span class="badge b-ok">approved</span>` : `<span class="badge b-bad">rejected</span>`;
  return JSON.stringify(f.label) === JSON.stringify(f.answer) ? `<span class="badge b-ok">right</span>` : `<span class="badge b-bad">miss</span>`;
}

function forkRow(f, fresh) {
  const raw = f.answer === true ? "yes" : f.answer === false ? "no" : String(f.answer ?? "…");
  return `<tr class="${fresh ? "new" : ""}"><td class="mono muted nowrap">${time(f.ts)}</td><td class="mono">${f.ticket ? "#" + f.ticket : "—"}</td>
    <td class="nowrap"><b>${esc(f.node)}</b> · <span class="mono">${esc(f.fork)}</span></td><td class="nowrap">${probCell(f)}</td><td>${routeBadge(f.route)}</td>
    <td class="mono clip" title="${esc(raw)}">${esc(raw.split("/").pop())}</td><td>${resultCell(f)}</td></tr>`;
}

function render() {
  const r = state.report, w = state.window;
  $("window").className = "pill " + w.state;
  $("window").textContent = { active: "you are active", passive: "passive work window", closed: "window closed · N9 paused" }[w.state];
  const sharpPct = r.forks_answered ? Math.round((r.forks_sharp_by_jev / r.forks_answered) * 100) : 0;
  const kpis = [
    ["Loops closed", r.loops_closed, `${r.back_edges} back edges · ${r.escalations} escalations`],
    ["Forks answered", r.forks_answered, `${sharpPct}% sharp by Jev`],
    ["Jev latency", r.jev_avg_latency_ms === null ? "—" : r.jev_avg_latency_ms + " ms", `${r.jev_calls} calls · ${r.jev_calls_over_1s} over 1 s`],
    ["Jev cost / decision", r.jev_cost_per_decision_usd === null ? "—" : "$" + r.jev_cost_per_decision_usd, r.jev_cost_per_decision_usd === null ? "set JEV_USD_PER_CALL" : "last 24 h"],
    ["Opus", r.opus_calls + " calls", "$" + r.opus_usd + " · " + r.opus_failed + " failed"],
    ["Hours saved", r.hours_saved_estimate, "estimate · last 24 h"],
  ];
  $("kpis").innerHTML = kpis.map(([l, v, h]) => `<div class="card kpi"><p>${l}</p><b>${esc(v)}</b><small>${esc(h)}</small></div>`).join("");
  const current = new Set(state.tickets.filter((t) => ["running", "waiting"].includes(t.state)).map((t) => t.node));
  $("pipeline").innerHTML = NODES.map((n) => `<span class="node ${current.has(n.split(" ")[0]) ? "on" : ""}">${n}</span>`).join("<span class='muted'>→</span>");
  $("forks").innerHTML = state.forks.length ? state.forks.map((f) => forkRow(f, false)).join("") : `<tr><td colspan="7" class="empty">No forks yet. They appear here live.</td></tr>`;
  state.forks.forEach((f) => seen.add(f.id));
  const pending = state.gates.filter((g) => g.status === "pending");
  $("gates").innerHTML = pending.length ? pending.map((g) => `<div class="gate"><div><span class="badge b-wait">${esc(g.gate)} #${g.id}</span> ${esc(g.summary)}</div>
      <div class="actions"><button class="approve" onclick="decide(${g.id},'approve',this)">Approve</button><button class="reject" onclick="decide(${g.id},'reject',this)">Reject</button></div></div>`).join("")
    : `<div class="empty">Nothing is waiting for you.</div>`;
  const stateBadge = { running: "b-jev", waiting: "b-wait", shipped: "b-ok", parked: "b-bad", rejected: "b-bad", needs_spec: "b-neutral", new: "b-neutral" };
  $("tickets").innerHTML = state.tickets.length ? `<table><tbody>${state.tickets.map((t) => `<tr><td class="mono">#${t.number}</td><td>${esc(t.title)}</td>
      <td><span class="badge ${stateBadge[t.state] || "b-neutral"}">${esc(t.state)}${t.node && ["running", "waiting"].includes(t.state) ? " · " + esc(t.node) : ""}</span></td>
      <td class="mono muted">$${Number(t.usd).toFixed(2)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Label an issue <span class="mono">agent-ready</span> to start.</div>`;
  $("improve").innerHTML = state.improve.length ? `<table><tbody>${state.improve.map((i) => `<tr><td class="mono muted">${time(i.ts)}</td>
      <td><span class="badge ${i.status === "shipped" ? "b-ok" : i.status === "rejected" ? "b-bad" : "b-neutral"}">${esc(i.status)}</span></td>
      <td class="mono">${i.score_old === null ? "" : Number(i.score_old).toFixed(2) + " → " + Number(i.score_new).toFixed(2)}</td></tr>`).join("")}</tbody></table>`
    : `<div class="empty">Runs only while you are working.</div>`;
  $("updated").textContent = "updated " + new Date().toLocaleTimeString();
}

async function decide(id, verb, btn) {
  btn.disabled = true;
  try { await api(`/api/gates/${id}/${verb}`, { method: "POST" }); await load(); }
  catch (e) { alert(e.message); btn.disabled = false; }
}

async function load() { state = await api("/api/state"); render(); }

let reloadTimer = null;
function connect() {
  const es = new EventSource("/api/stream");
  es.onopen = () => { $("live").classList.add("live"); $("live-text").textContent = "live"; };
  es.onerror = () => { $("live").classList.remove("live"); $("live-text").textContent = "reconnecting"; };
  es.onmessage = (m) => {
    const d = JSON.parse(m.data);
    const fresh = d.forks.filter((f) => !seen.has(f.id)).reverse();
    if (fresh.length) {
      const tbody = $("forks");
      if (!seen.size) tbody.innerHTML = "";
      fresh.forEach((f) => { seen.add(f.id); tbody.insertAdjacentHTML("afterbegin", forkRow(f, true)); });
    }
    clearTimeout(reloadTimer); reloadTimer = setTimeout(load, 800);  // refresh KPIs, gates and tickets
  };
}

function heartbeat() { if (document.visibilityState === "visible") api("/api/heartbeat", { method: "POST" }).catch(() => {}); }

load().then(() => { connect(); heartbeat(); setInterval(heartbeat, 60000); }).catch(() => {});
document.addEventListener("visibilitychange", heartbeat);
</script>
</body>
</html>
