name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB: postgres
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements-dev.txt
      - name: Check migrations
        working-directory: backend
        run: ../.venv/bin/python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Tests
        working-directory: backend
        run: ../.venv/bin/pytest
      - name: Benchmark (offline)
        working-directory: backend
        run: ../.venv/bin/python benchmark/run.py --out /tmp/results.json
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
  agents:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
      - run: git config --global user.email ci@local && git config --global user.name ci && git config --global init.defaultBranch main
      - run: python -m pytest -q tests
